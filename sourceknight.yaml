project:
  sourceknight: 0.3
  name: PlayerManager

  dependencies:
    - name: sourcemod
      type: tar
      version: 1.12
      location: https://sm.alliedmods.net/smdrop/1.12/sourcemod-1.12.0-git7223-linux.tar.gz
      unpack:
        - source: /addons
          dest: /addons

    - name: multicolors
      type: git
      repo: https://github.com/srcdslab/sm-plugin-MultiColors
      unpack:
        - source: /addons
          dest: /addons

    - name: ext-connect
      type: git
      repo: https://github.com/srcdslab/sm-ext-connect
      unpack:
        - source: /connect.inc
          dest: /addons/sourcemod/scripting/include/connect.inc

    - name: ext-ripext
      type: git
      repo: https://github.com/srcdslab/sm-ext-ripext
      unpack:
        - source: /pawn/scripting
          dest: /addons/sourcemod/scripting

    - name: proxykiller
      type: git
      repo: https://github.com/srcdslab/sm-plugin-ProxyKiller
      unpack:
        - source: /addons
          dest: /addons

    - name: utilshelper
      type: git
      repo: https://github.com/srcdslab/sm-plugin-utilshelper
      unpack:
        - source: /addons
          dest: /addons

  root: /
  output: /addons/sourcemod/plugins

  targets:
    - PlayerManager
